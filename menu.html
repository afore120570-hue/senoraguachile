<title>Catálogo — El Señor Aguachile</title>
<meta name="theme-color" content="#111111" />
<meta property="og:title" content="Catálogo — El Señor Aguachile" />
<meta property="og:description" content="Camarones, aguachiles, mojarras, cocteles y bebidas." />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap');

  :root{
    --black:#111111;
    --red:#C81E1E;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:#0c0c0c;
    font-family:'Inter',sans-serif;
    color:#fff;
    min-height:100vh;
  }

  /* Barra superior fija */
  .topbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:10px;
    background:rgba(12,12,12,0.94);
    backdrop-filter: blur(8px);
    padding:12px 14px;
    border-bottom:2px solid var(--red);
  }
  .back{
    display:inline-flex; align-items:center; gap:7px;
    color:#fff; text-decoration:none;
    background:rgba(255,255,255,0.08);
    padding:8px 13px; border-radius:999px;
    font-size:13px; font-weight:600;
  }
  .back:active{ transform:scale(0.96); }
  .topbar h1{
    font-size:14px; font-weight:700; margin:0;
    letter-spacing:.08em; text-transform:uppercase;
  }

  /* Pestañas */
  .tabs{
    display:flex; gap:8px;
    padding:12px 14px 4px;
    justify-content:center;
  }
  .tab{
    flex:1; max-width:180px;
    background:rgba(255,255,255,0.07);
    color:#fff; border:none;
    padding:11px 10px; border-radius:11px;
    font-family:'Inter',sans-serif;
    font-size:13.5px; font-weight:700;
    cursor:pointer;
    transition:background .15s ease;
  }
  .tab.active{ background:var(--red); }

  .sheet{ padding:12px 10px 26px; }
  .sheet img{
    display:block;
    width:100%;
    max-width:560px;
    margin:0 auto;
    border-radius:12px;
    box-shadow:0 14px 34px -18px rgba(0,0,0,0.9);
  }
  .hidden{ display:none; }

  .hint{
    text-align:center;
    font-size:11px;
    color:rgba(255,255,255,0.45);
    padding:0 20px 10px;
    letter-spacing:.04em;
  }

  /* Botón flotante de pedido */
  .order{
    position:fixed; left:50%; bottom:18px;
    transform:translateX(-50%);
    display:inline-flex; align-items:center; gap:9px;
    background:#25D366; color:#fff;
    text-decoration:none;
    padding:13px 22px; border-radius:999px;
    font-size:14.5px; font-weight:700;
    box-shadow:0 12px 26px -10px rgba(0,0,0,0.8);
    z-index:6;
  }
  .order:active{ transform:translateX(-50%) scale(0.96); }
  .order i{ font-size:17px; }
</style>
</head>
