  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; transform:none; }
  }

  /* --- Portada --- */
  .banner{
    flex: 0 0 auto;
    height: clamp(46px, 8dvh, 72px);
    background: radial-gradient(circle at 30% 0%, #232323, #0c0c0c 70%);
    position:relative;
  }
  .banner::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.12), rgba(0,0,0,0.5));
  }
  .banner::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0;
    height:3px;
    background: var(--red);
  }

  .avatar-wrap{
    flex: 0 0 auto;
    margin: clamp(-40px, -6.5dvh, -24px) auto 0;
    width: clamp(78px, 16dvh, 122px);
    height: clamp(78px, 16dvh, 122px);
    position:relative;
  }
  .avatar-wrap::before{
    content:"";
    position:absolute; inset:-4px;
    border-radius:50%;
    border:1.5px solid var(--red);
    opacity:.7;
  }
  .avatar{
    width:100%; height:100%;
    border-radius:50%;
    background:#fff;
    border:4px solid #fff;
    box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:clamp(18px,3.4dvh,28px); color:var(--black);
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }

  /* --- Nombre / categoría --- */
  .biz-name{
    flex: 0 0 auto;
    text-align:center;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size: clamp(16px, 3dvh, 24px);
    font-weight:600;
    line-height:1.15;
    margin: clamp(8px,1.6dvh,16px) 20px clamp(2px,0.6dvh,6px);
    letter-spacing:.005em;
  }
  .biz-cat{
    flex: 0 0 auto;
    text-align:center;
    font-size: clamp(9.5px, 1.8dvh, 12px);
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color: var(--gray-text);
    margin: 0 0 clamp(10px,2dvh,24px);
  }

  /* --- Grid principal (3 columnas) --- */
  .grid{
    flex: 0 0 auto;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(10px,2dvh,20px) 8px;
    padding: 0 clamp(14px,4vw,22px);
  }
  .tile{
    display:flex; flex-direction:column; align-items:center; gap:clamp(4px,0.9dvh,8px);
    text-decoration:none;
    color: var(--black);
    background:none; border:none; cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .tile-icon{
    position:relative;
    width: clamp(58px, 12dvh, 96px);
    height: clamp(58px, 12dvh, 96px);
    border-radius: clamp(15px, 2.8dvh, 22px);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 20px -8px rgba(0,0,0,0.4);
    transition: transform .15s ease, box-shadow .15s ease;
    color:#fff;
    overflow:hidden;
  }
  .tile-icon::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:46%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.28), rgba(255,255,255,0));
    pointer-events:none;
  }
  .tile-icon i{ font-size: clamp(26px, 5.4dvh, 44px); position:relative; }

  /* Íconos dibujados (Google Maps / Reseñas): fondo blanco, borde sutil,
     y sin el brillo superior que sí llevan los de color */
  .tile-icon.icono-svg{
    box-shadow: 0 10px 20px -8px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(17,17,17,0.09);
  }
  .tile-icon.icono-svg::before{ display:none; }
  .tile-icon.icono-svg svg,
  .tile-icon.icono-svg img{
    position:relative;
    width:64%; height:64%;
    object-fit:contain;
  }
  .tile:active .tile-icon{ transform: scale(0.92) translateY(1px); box-shadow: 0 4px 10px -4px rgba(0,0,0,0.35); }
  .tile-label{ font-size: clamp(10.5px,1.9dvh,13px); font-weight:600; text-align:center; line-height:1.1; }

  /* --- Fila secundaria (centrada, no forzada a 3 columnas) --- */
  .row-secondary{
    flex: 0 0 auto;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap: clamp(10px,2dvh,20px) 20px;
    padding: clamp(10px,2.2dvh,24px) 22px 4px;
  }
  .row-secondary .tile{ width: clamp(66px, 13dvh, 108px); }

  /* --- Cuenta para pagos --- */
  .pay-card{
    flex: 0 0 auto;
    margin: clamp(10px,2.2dvh,22px) 22px 0;
    background: #fff;
    border-radius:16px;
    padding: clamp(10px,2dvh,16px) clamp(12px,3vw,18px);
    box-shadow: 0 14px 30px -20px rgba(0,0,0,0.35), 0 0 0 1px var(--line);
  }
  .pay-title{
    display:flex; align-items:center; gap:10px;
    font-weight:700; font-size: clamp(11.5px,2dvh,13.5px); margin-bottom: clamp(6px,1.2dvh,10px);
  }
  .pay-title .badge{
    width: clamp(20px,3.6dvh,26px); height: clamp(20px,3.6dvh,26px); border-radius:50%;
    background: var(--red);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size: clamp(10px,1.8dvh,12px);
  }
  .pay-bank{ font-size: clamp(10px,1.8dvh,12px); color: var(--gray-text); margin-bottom: clamp(6px,1.4dvh,12px); }
  .clabe-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#FAFAFA; border:1px solid var(--line); border-radius:10px;
    padding: clamp(8px,1.6dvh,11px) clamp(10px,2.6vw,13px);
  }
  .clabe-number{
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(11px,1.9dvh,13.5px);
    letter-spacing:.03em;
  }
  .copy-btn{
    display:flex; align-items:center; gap:6px;
    background: var(--red);
    color:#fff; border:none;
    padding: clamp(6px,1.4dvh,8px) clamp(10px,2.6vw,13px);
    border-radius:8px;
    font-size: clamp(11px,1.9dvh,12.5px);
    font-weight:700;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    white-space:nowrap;
    transition: transform .12s ease;
  }
  .copy-btn:active{ transform: scale(0.94); }

  .footer{
    flex: 1 1 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: clamp(8px,1.4dvh,16px) 16px;
    font-size: clamp(9px,1.5dvh,10.5px);
    letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--gray-text);
  }
  .footer::before{
    content:"";
    display:block;
    width:36px; height:2px;
    background: var(--line);
    margin: 0 auto clamp(8px,1.4dvh,14px);
  }

  .toast{
    position:fixed; left:50%; bottom:26px;
    transform: translate(-50%, 12px);
    background: var(--black); color:#fff;
    padding:10px 18px; border-radius:999px;
    font-size:13px; font-weight:500;
    opacity:0; pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
    z-index:10;
  }
  .toast.show{ opacity:1; transform: translate(-50%, 0); }
</style>
</head>
<body>

  <div class="card">
    <div class="banner" id="banner"></div>
    <div class="avatar-wrap">
      <div class="avatar" id="avatar"></div>
    </div>

    <h1 class="biz-name" id="bizName"></h1>
    <p class="biz-cat" id="bizCat"></p>

    <div class="grid" id="grid"></div>
    <div class="row-secondary" id="rowSecondary"></div>

    <div class="pay-card">
      <div class="pay-title"><span class="badge"><i class="fa-regular fa-credit-card"></i></span> Tarjeta para pagos</div>
      <div class="pay-bank" id="payBank"></div>
      <div class="clabe-row">
        <span class="clabe-number" id="clabeNumber"></span>
        <button class="copy-btn" id="copyBtn"><i class="fa-regular fa-copy"></i> Copiar</button>
      </div>
    </div>

    <div class="footer" id="footer"></div>
  </div>

  <div class="toast" id="toast"></div>

function tileIcon(tipo){
  const i = ICONOS[tipo] || ICONOS.whatsapp;
  if (i.img) {
    const w = i.escala ? ` style="width:${i.escala};height:${i.escala};"` : '';
    return `<span class="tile-icon icono-svg" style="background:${i.bg};"><img src="${i.img}" alt=""${w}></span>`;
  }
  if (i.svg) {
    return `<span class="tile-icon icono-svg" style="background:${i.bg};">${i.svg}</span>`;
  }
  const estilo = i.escala ? ` style="font-size:calc(clamp(26px, 5.4dvh, 44px) * ${i.escala});"` : '';
  return `<span class="tile-icon" style="background:${i.bg};"><i class="${i.clase}"${estilo}></i></span>`;
}

/* ======================================================
   Render
   ====================================================== */
document.getElementById('bizName').textContent = CONFIG.negocio;
document.getElementById('bizCat').textContent = CONFIG.categoria;
document.getElementById('footer').textContent = CONFIG.footerTexto;
document.getElementById('payBank').textContent = CONFIG.pago.banco;
document.getElementById('clabeNumber').textContent = CONFIG.pago.clabe;
document.title = CONFIG.negocio + ' — Tarjeta Digital';

if (CONFIG.portadaUrl) {
  document.getElementById('banner').style.background = `url('${CONFIG.portadaUrl}') center 68% / cover no-repeat`;
}

const avatarEl = document.getElementById('avatar');
if (CONFIG.logoUrl) {
  avatarEl.innerHTML = `<img src="${CONFIG.logoUrl}" alt="${CONFIG.negocio}">`;
} else {
  avatarEl.textContent = CONFIG.negocio.split(' ').filter(Boolean).slice(0,2).map(p => p[0].toUpperCase()).join('');
}

// --- Grid principal: Guardar + los primeros 5 enlaces ---
const grid = document.getElementById('grid');
const principales = CONFIG.enlaces.slice(0, 5);

const guardarBtn = document.createElement('a');
guardarBtn.className = 'tile';
guardarBtn.href = CONFIG.menuUrl;
guardarBtn.innerHTML = `${tileIcon('menu')}<span class="tile-label">Catálogo</span>`;
grid.appendChild(guardarBtn);

principales.forEach(link => grid.appendChild(crearEnlace(link)));

// --- Fila secundaria: el resto de enlaces ---
const rowSecondary = document.getElementById('rowSecondary');
CONFIG.enlaces.slice(5).forEach(link => rowSecondary.appendChild(crearEnlace(link)));

function crearEnlace(link){
  const a = document.createElement('a');
  a.className = 'tile';
  a.href = link.href;
  a.target = '_blank';
  a.rel = 'noopener';
  a.innerHTML = `${tileIcon(link.tipo)}<span class="tile-label">${link.label}</span>`;
  return a;
}

/* Guardar contacto (vCard) */
function descargarContacto(){
  const vcard = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    `FN:${CONFIG.negocio}`,
    `ORG:${CONFIG.negocio}`,
    `TEL;TYPE=CELL:${CONFIG.telefono}`,
    CONFIG.web ? `URL:${CONFIG.web}` : '',
    `NOTE:${CONFIG.categoria}`,
    'END:VCARD'
  ].filter(Boolean).join('\n');
  const blob = new Blob([vcard], { type: 'text/vcard' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${CONFIG.negocio.replace(/\s+/g,'_')}.vcf`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Contacto guardado ✅');
}

/* Copiar CLABE */
document.getElementById('copyBtn').addEventListener('click', async () => {
  const clabe = CONFIG.pago.clabe.replace(/\s+/g, '');
  try {
    await navigator.clipboard.writeText(clabe);
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = clabe;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  showToast('Número copiado ✅');
});

let toastTimer;
function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}
</script>
